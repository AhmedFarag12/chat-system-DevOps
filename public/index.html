<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #e3e5e8; --text: #1d2129; --muted: #7a828e;
    --accent: #2f6fed; --mine: #2f6fed; --mine-text: #fff; --theirs: #eceef2; --ok: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e8eaee; --muted: #8b94a1;
      --accent: #4b86ff; --mine: #3a6fe0; --theirs: #232932; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* login */
  #login { height: 100%; display: grid; place-items: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 360px; }
  .card h1 { margin: 0 0 16px; font-size: 20px; }
  .card input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .btn { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .quick button:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .err { color: #e5484d; font-size: 13px; min-height: 18px; margin: 4px 0 0; }

  /* app */
  #app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .me { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .me b { display: block; }
  .me small { color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  .search { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  #list { overflow-y: auto; flex: 1; }
  .sec { padding: 10px 16px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .row { padding: 10px 16px; display: flex; gap: 10px; align-items: center; cursor: pointer; border-bottom: 1px solid var(--line); }
  .row:hover, .row.active { background: var(--bg); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; position: relative; text-transform: uppercase; }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); border: 2px solid var(--panel); }
  .dot.on { background: var(--ok); }
  .row .t { min-width: 0; flex: 1; }
  .row .t b, .row .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { color: var(--muted); font-size: 13px; }
  .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .empty { margin: auto; color: var(--muted); }
  header.chat { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  header.chat small { color: var(--muted); display: block; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: min(70%, 520px); padding: 8px 12px; border-radius: 14px; background: var(--theirs); align-self: flex-start; word-wrap: break-word; white-space: pre-wrap; }
  .msg.mine { background: var(--mine); color: var(--mine-text); align-self: flex-end; }
  .msg .who { font-size: 12px; font-weight: 600; opacity: .75; }
  .msg .meta { font-size: 11px; opacity: .65; text-align: right; margin-top: 2px; }
  form.send { display: flex; gap: 8px; padding: 12px; background: var(--panel); border-top: 1px solid var(--line); }
  form.send input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
  form.send button { width: auto; padding: 10px 20px; border-radius: 999px; }
  .status { position: fixed; top: 8px; right: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; }
    #app.chat-open aside { display: none; }
    #app:not(.chat-open) main { display: none; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h1>Chat login</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit">Log in</button>
    <p class="err" id="loginErr"></p>
    <div class="quick" id="quick"></div>
    <p class="hint">Each browser tab keeps its own login, so open two tabs as different users to chat between them.</p>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="me"><div><b id="meName"></b><small id="conn">connecting…</small></div><button class="link" id="logout">Log out</button></div>
    <div class="search"><input id="q" placeholder="Search users to start a chat" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="empty" id="empty">Pick a conversation or search for a user</div>
    <header class="chat hidden" id="head">
      <button class="link" id="back" title="Back">←</button>
      <div class="avatar" id="hAvatar"><span id="hLetter"></span><i class="dot" id="hDot"></i></div>
      <div><b id="hName"></b><small id="hSub"></small></div>
    </header>
    <div id="msgs" class="hidden"></div>
    <form class="send hidden" id="sendForm">
      <input id="text" placeholder="Type a message" autocomplete="off" maxlength="4000">
      <button class="btn" type="submit">Send</button>
    </form>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
                del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };

const state = { token: store.get('token'), me: null, socket: null, convos: [], active: null,
                messages: [], online: {}, unread: {}, typingTimer: null, stopTyping: null, results: [] };

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts,
    headers: { 'Content-Type': 'application/json', ...(state.token && { Authorization: 'Bearer ' + state.token }) },
    body: opts.body && JSON.stringify(opts.body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : data.message || res.statusText);
  return data;
}

/* ---------- login ---------- */
['ahmed', 'sara', 'omar', 'mona', 'youssef'].forEach((n) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = n;
  b.onclick = () => { $('email').value = n + '@example.com'; $('password').value = '123456'; $('loginForm').requestSubmit(); };
  $('quick').append(b);
});

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  try {
    const r = await api('/auth/login', { method: 'POST', body: { email: $('email').value, password: $('password').value } });
    state.token = r.accessToken; store.set('token', r.accessToken);
    await start();
  } catch (err) { $('loginErr').textContent = err.message; }
};

$('logout').onclick = () => { store.del('token'); location.reload(); };

/* ---------- start ---------- */
async function start() {
  try { state.me = await api('/users/me'); }
  catch { store.del('token'); state.token = null; return; }

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('meName').textContent = state.me.username;

  state.socket = io({ auth: { token: state.token } });
  const s = state.socket;
  s.on('connect', () => { $('conn').textContent = 'online'; refreshPresence(); });
  s.on('disconnect', () => { $('conn').textContent = 'reconnecting…'; });
  s.on('connect_error', () => { $('conn').textContent = 'connection error'; });
  s.on('message:new', onNewMessage);
  s.on('typing', onTyping);
  s.on('presence', ({ userId, online }) => { state.online[userId] = online; renderList(); renderHead(); });
  s.on('message:read', ({ conversationId, userId }) => {
    if (state.active?._id !== conversationId) return;
    state.messages.forEach((m) => { if (isMine(m) && !m.readBy.includes(userId)) m.readBy.push(userId); });
    renderMessages();
  });

  await loadConvos();
}

/* ---------- conversations ---------- */
const other = (c) => c.participants.find((p) => p._id !== state.me._id) || c.participants[0];
const title = (c) => (c.isGroup ? c.name : other(c).username);

async function loadConvos() {
  state.convos = await api('/conversations');
  renderList();
  refreshPresence();
}

function refreshPresence() {
  if (!state.socket?.connected) return;
  const ids = [...new Set(state.convos.flatMap((c) => c.participants.map((p) => p._id)))].filter((id) => id !== state.me._id);
  if (!ids.length) return;
  state.socket.emit('presence:get', { userIds: ids }, (map) => { Object.assign(state.online, map); renderList(); renderHead(); });
}

function avatar(letter, online) {
  const a = document.createElement('div'); a.className = 'avatar';
  a.append(letter[0] || '?');
  const d = document.createElement('i'); d.className = 'dot' + (online ? ' on' : '');
  a.append(d); return a;
}

function renderList() {
  const box = $('list'); box.replaceChildren();
  if (state.results.length) {
    box.append(sec('Users'));
    state.results.forEach((u) => {
      const r = row(avatar(u.username, state.online[u._id]), u.username, 'Start a chat');
      r.onclick = () => startDirect(u);
      box.append(r);
    });
    return;
  }
  box.append(sec('Conversations'));
  if (!state.convos.length) { const p = document.createElement('div'); p.className = 'sec'; p.textContent = 'No chats yet — search for a user above'; box.append(p); }
  state.convos.forEach((c) => {
    const r = row(avatar(title(c), !c.isGroup && state.online[other(c)._id]), title(c), c.lastMessage?.content || '', state.unread[c._id]);
    if (state.active?._id === c._id) r.classList.add('active');
    r.onclick = () => openConvo(c);
    box.append(r);
  });
}
function sec(t) { const d = document.createElement('div'); d.className = 'sec'; d.textContent = t; return d; }
function row(av, name, sub, unread) {
  const r = document.createElement('div'); r.className = 'row';
  const t = document.createElement('div'); t.className = 't';
  const b = document.createElement('b'); b.textContent = name;
  const s = document.createElement('span'); s.textContent = sub;
  t.append(b, s); r.append(av, t);
  if (unread) { const u = document.createElement('span'); u.className = 'badge'; u.textContent = unread; r.append(u); }
  return r;
}

let searchTimer;
$('q').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('q').value.trim();
  if (!q) { state.results = []; renderList(); return; }
  searchTimer = setTimeout(async () => {
    try { state.results = await api('/users?q=' + encodeURIComponent(q)); if (!state.results.length) state.results = []; } catch { state.results = []; }
    renderList();
  }, 250);
};

async function startDirect(u) {
  const c = await api('/conversations/direct', { method: 'POST', body: { userId: u._id } });
  state.results = []; $('q').value = '';
  await new Promise((res) => state.socket.emit('conversation:join', { conversationId: c._id }, res));
  await loadConvos();
  openConvo(state.convos.find((x) => x._id === c._id));
}

/* ---------- chat view ---------- */
async function openConvo(c) {
  state.active = c; state.unread[c._id] = 0;
  $('app').classList.add('chat-open');
  ['empty'].forEach((id) => $(id).classList.add('hidden'));
  ['head', 'msgs', 'sendForm'].forEach((id) => $(id).classList.remove('hidden'));
  state.socket.emit('conversation:join', { conversationId: c._id });
  renderHead(); renderList();
  const list = await api(`/conversations/${c._id}/messages?limit=50`);
  state.messages = list.reverse().map(norm);
  renderMessages();
  markRead();
  $('text').focus();
}
$('back').onclick = () => { $('app').classList.remove('chat-open'); };

function renderHead() {
  const c = state.active; if (!c) return;
  $('hLetter').textContent = title(c)[0] || '?';
  $('hName').textContent = title(c);
  const on = !c.isGroup && state.online[other(c)._id];
  $('hDot').className = 'dot' + (on ? ' on' : '');
  if (!$('hSub').dataset.typing) $('hSub').textContent = c.isGroup ? c.participants.length + ' members' : on ? 'online' : 'offline';
}

const norm = (m) => ({ ...m, sender: typeof m.sender === 'string' ? { _id: m.sender } : m.sender });
const isMine = (m) => m.sender._id === state.me._id;

function renderMessages() {
  const box = $('msgs');
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.replaceChildren();
  state.messages.forEach((m) => {
    const d = document.createElement('div'); d.className = 'msg' + (isMine(m) ? ' mine' : '');
    if (state.active.isGroup && !isMine(m)) { const w = document.createElement('div'); w.className = 'who'; w.textContent = m.sender.username || ''; d.append(w); }
    d.append(m.content);
    const meta = document.createElement('div'); meta.className = 'meta';
    const time = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.textContent = time + (isMine(m) ? (m.readBy.length > 1 ? ' ✓✓' : ' ✓') : '');
    d.append(meta); box.append(d);
  });
  if (stick) box.scrollTop = box.scrollHeight;
}

function markRead() { if (state.active) state.socket.emit('message:read', { conversationId: state.active._id }); }

async function onNewMessage(raw) {
  const m = norm(raw);
  const known = state.convos.some((c) => c._id === m.conversation);
  if (state.active?._id === m.conversation) {
    if (!state.messages.some((x) => x._id === m._id)) state.messages.push(m);
    renderMessages();
    if (!isMine(m)) markRead();
  } else if (!isMine(m)) {
    state.unread[m.conversation] = (state.unread[m.conversation] || 0) + 1;
  }
  if (!known) { state.socket.emit('conversation:join', { conversationId: m.conversation }); }
  await loadConvos();
}

/* ---------- send + typing ---------- */
$('sendForm').onsubmit = (e) => {
  e.preventDefault();
  const content = $('text').value.trim();
  if (!content || !state.active) return;
  $('text').value = '';
  clearTimeout(state.stopTyping);
  state.socket.emit('typing', { conversationId: state.active._id, isTyping: false });
  state.socket.emit('message:send', { conversationId: state.active._id, content }, (ack) => {
    if (ack?.status === 'error' || ack?.message) alert('Send failed: ' + (ack.message || 'unknown'));
  });
};

$('text').oninput = () => {
  if (!state.active) return;
  state.socket.emit('typing', { conversationId: state.active._id, isTyping: true });
  clearTimeout(state.stopTyping);
  state.stopTyping = setTimeout(() => state.socket.emit('typing', { conversationId: state.active._id, isTyping: false }), 1500);
};

function onTyping({ conversationId, userId, isTyping }) {
  if (state.active?._id !== conversationId) return;
  const p = state.active.participants.find((x) => x._id === userId);
  const sub = $('hSub');
  if (isTyping) {
    sub.dataset.typing = '1';
    sub.textContent = (p?.username || 'someone') + ' is typing…';
    clearTimeout(state.typingTimer);
    state.typingTimer = setTimeout(() => { delete sub.dataset.typing; renderHead(); }, 3000);
  } else { delete sub.dataset.typing; renderHead(); }
}

if (state.token) start();
</script>
</body>
</html>
